<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fit Travel : Book Now</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap">
    <link rel="stylesheet" href="booknow.css">
</head>
<body>

    <div class="page-wrapper">

        <div class="booking-header">
            <a href="website.html" class="logo-link">
                <div class="hero-logo-icon">✈️</div>
                <span class="logo-text">Fit Travel</span>
            </a>
            <h1 class="page-title">Book Your Trip</h1>
            <p class="page-subtitle">Fill in the details below and we'll take care of the rest</p>
        </div>

        <div class="booking-card">
            <form action="#" method="post" class="booking-form">

                <div class="form-section">
                    <h2 class="section-title">
                        <span class="section-number">1</span>
                        Trip Details
                    </h2>
                    <div class="fields-grid">
                        <div class="field-group">
                            <label for="destination">Destination</label>
                            <input type="text" id="destination" name="destination" placeholder="e.g. Maasai Mara" required>
                        </div>
                        <div class="field-group">
                            <label for="travel-date">Travel Date</label>
                            <input type="date" id="travel-date" name="travel-date" required>
                        </div>
                        <div class="field-group">
                            <label for="return-date">Return Date</label>
                            <input type="date" id="return-date" name="return-date">
                        </div>
                        <div class="field-group">
                            <label for="guests">Number of Guests</label>
                            <input type="number" id="guests" name="guests" min="1" placeholder="1" required>
                        </div>
                        <div class="field-group full-width">
                            <label for="notes">Special Requests </label>
                            <textarea id="notes" name="notes" placeholder="Any dietary needs, accessibility requirements, preferences..."></textarea>
                        </div>
                    </div>
                </div>

                <div class="divider"></div>

                <div class="form-section">
                    <h2 class="section-title">
                        <span class="section-number">2</span>
                        Your Details
                    </h2>
                    <div class="fields-grid">
                        <div class="field-group">
                            <label for="full-name">Full Name</label>
                            <input type="text" id="full-name" name="full-name" placeholder="John Doe" required>
                        </div>
                        <div class="field-group">
                            <label for="email">Email Address</label>
                            <input type="email" id="email" name="email" placeholder="you@example.com" required>
                        </div>
                        <div class="field-group">
                            <label for="phone">Phone Number</label>
                            <input type="tel" id="phone" name="phone" placeholder="+254 700 000 000" required>
                        </div>
                        <div class="field-group">
                            <label for="id-number">ID / Passport Number</label>
                            <input type="text" id="id-number" name="id-number" placeholder="Enter ID or passport number" required>
                        </div>
                    </div>
                </div>

                <div class="divider"></div>

               
                <div class="form-section">
                    <h2 class="section-title">
                        <span class="section-number">3</span>
                        Payment (M-Pesa)
                    </h2>
                    <div class="fields-grid">
                        <div class="field-group">
                            <label for="mpesa-name">M-Pesa Account Name</label>
                            <input type="text" id="mpesa-name" name="mpesa-name" placeholder="Full name on M-Pesa" required>
                        </div>
                        <div class="field-group">
                            <label for="mpesa-number">M-Pesa Number</label>
                            <input type="tel" id="mpesa-number" name="mpesa-number" placeholder="+254 700 000 000" required>
                        </div>
                        <div class="field-group">
                            <label for="mpesa-pin">M-Pesa PIN</label>
                            <input type="password" id="mpesa-pin" name="mpesa-pin" placeholder="••••••" maxlength="6" required>
                        </div>
                    </div>
                </div>

                
                <div class="form-actions">
                    <a href="index.html" class="back-btn">← Back to Home</a>
                    <button type="submit" class="confirm-btn">Confirm and Pay</button>
                </div>

            </form>
        </div>

    </div>

</body>
</html>
