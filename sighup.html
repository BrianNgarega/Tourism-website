<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fit Travel : Sign Up / Log In</title>
    <link rel="stylesheet" href="signup.css">
</head>
<body>

    <input type="checkbox" id="toggle" class="toggle-input">

    <div class="form-box signup-box">
        <form class="form" action="#" method="post">
            <span class="title">Sign Up</span>
            <div class="form-container">
                <input type="text" class="input" placeholder="Full Name" required>
                <input type="email" class="input" placeholder="Email" required>
                <input type="password" class="input" placeholder="Password" required>
            </div>
            <button type="submit">Sign Up</button>
        </form>
        <div class="form-section">
            <p>Have an account?
                <label for="toggle" class="switch-link">Log In</label>
            </p>
        </div>
    </div>

    <div class="form-box login-box">
        <form class="form" action="#" method="post">
            <span class="title">Log In</span>
            <div class="form-container">
                <input type="email" class="input" placeholder="Email" required>
                <input type="password" class="input" placeholder="Password" required>
            </div>
            <button type="submit">Log In</button>
        </form>
        <div class="form-section">
            <p>No account yet?
                <label for="toggle" class="switch-link">Sign Up</label>
            </p>
        </div>
    </div>

    <div class="back-wrap">
        <a href="index.html">
            <button class="back-button">← Back</button>
        </a>
    </div>

</body>
</html>
